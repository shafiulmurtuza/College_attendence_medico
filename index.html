:root{
  --bg:#12151A;
  --surface:#1B1F26;
  --surface2:#20252D;
  --ink:#EDEBE3;
  --muted:#8B93A0;
  --border:#2A2F38;
  --gold:#D4A24C;
  --gold-dim:#8A733A;
  --good:#4CAF7D;
  --warn:#E0A64C;
  --bad:#E0654C;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Poppins',-apple-system,sans-serif;
  font-variant-numeric:tabular-nums;
  padding-bottom:110px;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,.serif,.big-pct,.subject-name{font-family:'Lora',serif;}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;margin-right:4px;}
.icon-lg{width:26px;height:26px;}

header{
  padding:calc(24px + env(safe-area-inset-top)) 18px 18px;
  border-bottom:1px solid var(--border);

  flex:1;padding:8px 0;border-radius:7px;border:1px solid var(--border);background:var(--surface2);
  color:var(--ink);font-size:12.5px;cursor:pointer;font-family:'Poppins';
}
</style>
</head>
<body>

<header>
  <h1><svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Attendance</h1>
  <div class="streak" id="streakRow" style="display:none;">
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2c1 3-2 4-2 7a4 4 0 008 0c0-1-.5-2-1-3 2 1 3 3 3 6a6 6 0 01-12 0c0-4 2-5 4-10z"/></svg>
    <span id="streakText">0 day streak</span>
  </div>
  <div class="agg-row">
    <div class="agg-pct" id="aggPct">–</div>
    <div class="agg-meta" id="aggMeta">no classes logged yet</div>
  </div>
</header>

<main id="list"></main>

<div class="add-wrap">
  <button class="add-toggle" id="addToggle">
    <svg class="icon" viewBox="0 0 24 24" style="margin-right:2px;"><path d="M12 5v14M5 12h14"/></svg>
    Add subject
  </button>
  <div class="add-form" id="addForm">
    <h2>New subject</h2>
    <label>Subject name</label>
    <input type="text" id="newName" placeholder="e.g. Pathology">
    <label>Target attendance %</label>
    <input type="number" id="newTarget" placeholder="e.g. 75" value="75" min="1" max="100">
    <label>Parts (theory, practical, etc.)</label>
    <div class="parts-draft" id="partsDraft"></div>
    <div class="add-part-inline">
      <input type="text" id="draftPartName" placeholder="Part name e.g. Theory">
      <input type="number" id="draftPartTotal" placeholder="Total" min="1" style="max-width:70px;">
      <input type="number" id="draftPartTarget" placeholder="Target%" min="1" max="100" style="max-width:75px;">
      <button id="draftPartAdd" type="button">+</button>
    </div>
    <button class="primary" id="newSave">Create subject</button>
  </div>
</div>

<div class="backup-section">
  <button class="backup-toggle" id="backupToggle">Backup / restore data</button>
  <div class="backup-panel" id="backupPanel">
    <label>Save to your phone (then share to Google Drive, email, etc.)</label>
    <div class="row2" style="margin-bottom:16px;">
      <button id="backupDownload">Download backup file</button>
      <button id="backupImportBtn">Import from file</button>
    </div>
    <input type="file" id="backupFileInput" accept="application/json,.json" style="display:none;">
    <hr style="border:none;border-top:1px solid var(--border);margin:14px 0;">
    <label>Or copy/paste as text</label>
    <textarea id="backupOut" readonly></textarea>
    <div class="row2" style="margin-bottom:14px;">
      <button id="backupCopy">Copy</button>
      <button id="backupRefresh">Refresh</button>
    </div>
    <label>Paste backup here to restore</label>
    <textarea id="backupIn" placeholder="Paste exported data here"></textarea>

      <button id="backupRestore">Restore</button>
    </div>
  </div>
</div>


<div class="undo-bar" id="undoBar">
  <span id="undoText">Marked</span>
  <button id="undoBtn">UNDO</button>
</div>

<script>
const KEY = 'attendance-app-data-v2';
let data = { subjects: [], presentDates: [] };
let lastAction = null;

const ICONS = {
  book: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>',
  flask: '<svg class="icon" viewBox="0 0 24 24"><path d="M9 2v6.5L3.5 19a2 2 0 001.7 3h13.6a2 2 0 001.7-3L15 8.5V2"/><path d="M9 2h6M8 15h8"/></svg>',
  target: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
  check: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>',
  x: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
  edit: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>',
  plus: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  shield: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg>',
  alert: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2 18a2 2 0 001.7 3h16.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>',
  book_open: '<svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M2 4.5A2.5 2.5 0 014.5 2H12v20H4.5A2.5 2.5 0 012 19.5z"/><path d="M22 4.5A2.5 2.5 0 0019.5 2H12v20h7.5a2.5 2.5 0 002.5-2.5z"/></svg>'
};

function partIcon(name){
  const n = (name||'').toLowerCase();
  if(n.includes('prac') || n.includes('lab')) return ICONS.flask;
  return ICONS.book;
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) data = JSON.parse(raw);
  }catch(e){}
  if(!data.presentDates) data.presentDates = [];
  render();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){ console.error(e); }
}

function pctColor(pct, threshold){
  if(pct >= threshold) return 'var(--good)';
  if(pct >= threshold - 10) return 'var(--warn)';
  return 'var(--bad)';
}

function aggFromCounts(total, attended, absent){
  const held = attended+absent;
  const remaining = Math.max(total-held,0);
  return {total, attended, absent, held, remaining};
}

function aggregateSubject(s){
  let total=0, attended=0, absent=0;
  s.parts.forEach(p=>{ total+=p.total; attended+=p.attended; absent+=p.absent; });
  return aggFromCounts(total, attended, absent);
}

function bunkInfo(agg, target){
  const {total, attended, held, remaining} = agg;
  if(total===0) return {status:'empty', text:'Add a part to start tracking', maxBunk:null};
  if(held===0) return {status:'neutral', text:'Not started yet', maxBunk:null};
  if(remaining<=0){
    const pct = (attended/total)*100;
    return pct>=target
      ? {status:'good', text:'Trimester done — target met', maxBunk:0}
      : {status:'bad', text:'Trimester done — target missed', maxBunk:0};
  }
  const needed = Math.max(0, Math.ceil((target/100)*total) - attended);
  const maxBunk = remaining - needed;
  if(maxBunk < 0) return {status:'bad', text:"Can't reach target even attending all remaining", maxBunk};
  if(maxBunk === 0) return {status:'bad', text:'Must attend every remaining class', maxBunk};
  if(maxBunk <= 2) return {status:'warn', text:'You can bunk '+maxBunk+' more class'+(maxBunk===1?'':'es'), maxBunk};
  return {status:'good', text:'You can bunk '+maxBunk+' more classes', maxBunk};
}

function chipHtml(info){
  const map = {good:['chip-good',ICONS.shield], warn:['chip-warn',ICONS.alert], bad:['chip-bad',ICONS.alert], neutral:['chip-neutral',ICONS.target], empty:['chip-neutral',ICONS.target]};
  const [cls, icon] = map[info.status] || map.neutral;
  let label = info.maxBunk!==null && info.status!=='empty' && info.status!=='neutral' ? (info.maxBunk<0? "can't reach" : info.maxBunk+" to bunk") : (info.status==='neutral'?'not started':'—');
  return `<span class="chip ${cls}">${icon}${label}</span>`;
}

function bunkMeterHtml(info, remaining){
  const colorMap = {good:'var(--good)', warn:'var(--warn)', bad:'var(--bad)', neutral:'var(--muted)', empty:'var(--muted)'};
  const color = colorMap[info.status] || 'var(--muted)';
  if(info.status==='empty' || info.status==='neutral'){
    return `<div class="part-meter"><div class="part-meter-top"><span>Bunk buffer</span><span class="part-meter-num" style="color:${color}">–</span></div><div class="part-meter-track"><div class="part-meter-fill" style="width:0%;background:${color}"></div></div></div>`;
  }
  if(remaining<=0){
    const label = info.status==='good' ? 'target met' : 'target missed';
    return `<div class="part-meter"><div class="part-meter-top"><span>Bunk buffer</span><span class="part-meter-num" style="color:${color}">${label}</span></div><div class="part-meter-track"><div class="part-meter-fill" style="width:${info.status==='good'?100:0}%;background:${color}"></div></div></div>`;
  }
  const pct = Math.max(0, Math.min(1, info.maxBunk/remaining)) * 100;
  const label = info.maxBunk<0 ? "can't reach" : info.maxBunk+' of '+remaining;
  return `<div class="part-meter"><div class="part-meter-top"><span>Bunk buffer</span><span class="part-meter-num" style="color:${color}">${label}</span></div><div class="part-meter-track"><div class="part-meter-fill" style="width:${pct}%;background:${color}"></div></div></div>`;
}

function computeStreak(){
  if(!data.presentDates || data.presentDates.length===0) return 0;
  const set = new Set(data.presentDates);
  let d = new Date();
  // if today not marked, check if yesterday was marked to still show streak count (but not increment for today)
  let cur = new Date(d);
  let streak = 0;
  const fmt = (dt)=> dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  if(!set.has(fmt(cur))){
    cur.setDate(cur.getDate()-1);
  }
  while(set.has(fmt(cur))){
    streak++;
    cur.setDate(cur.getDate()-1);
  }
  return streak;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';

  if(data.subjects.length===0){
    list.innerHTML = `<div class="empty">${ICONS.book_open}No subjects yet.<br>Add one below with its target % and parts (Theory, Practical...).</div>`;
  }

  let grandTotal=0, grandAttended=0, grandHeld=0;

  data.subjects.forEach(s=>{
    const agg = aggregateSubject(s);
    grandTotal += agg.total; grandAttended += agg.attended; grandHeld += agg.held;
    const pct = agg.held>0 ? Math.round((agg.attended/agg.held)*100) : 0;
    const color = pctColor(pct, s.target);
    const info = bunkInfo(agg, s.target);

    const partsHtml = s.parts.map(p=>{
      const pTarget = p.target || s.target;
      const pAgg = aggFromCounts(p.total, p.attended, p.absent);
      const premain = pAgg.remaining;
      const pInfo = bunkInfo(pAgg, pTarget);
      return `
      <div class="part">
        <div class="part-top">
          <div>
            <div class="part-name">${partIcon(p.name)}${escapeHtml(p.name)}</div>
            <div class="part-meta">Attended ${p.attended} · Bunked ${p.absent} · ${premain} left · target ${pTarget}%</div>
            ${bunkMeterHtml(pInfo, premain)}
          </div>
          <div class="part-actions">
            <button class="icon-btn icon-btn-present" data-sid="${s.id}" data-pid="${p.id}" data-act="present">${ICONS.check}</button>
            <button class="icon-btn icon-btn-absent" data-sid="${s.id}" data-pid="${p.id}" data-act="absent">${ICONS.x}</button>
          </div>
        </div>
        <div class="link-row">
          <button class="link-btn" data-toggle-edit="${p.id}">${ICONS.edit}Edit</button>
          <button class="link-btn" data-del-part="${s.id}|${p.id}">${ICONS.trash}Remove part</button>
        </div>
        <div class="part-edit" id="edit-${p.id}">
          <div class="row">
            <div class="field"><label>Present</label><input type="number" min="0" value="${p.attended}" id="e-att-${p.id}"></div>
            <div class="field"><label>Bunked</label><input type="number" min="0" value="${p.absent}" id="e-abs-${p.id}"></div>
            <div class="field"><label>Total</label><input type="number" min="1" value="${p.total}" id="e-tot-${p.id}"></div>
            <div class="field"><label>Target %</label><input type="number" min="1" max="100" value="${pTarget}" id="e-tgt-${p.id}"></div>
          </div>
          <div class="row2"><button class="save-btn" data-save-part="${s.id}|${p.id}">Save</button></div>
        </div>
      </div>`;
    }).join('');

    const div = document.createElement('div');
    div.className = 'subject';
    div.innerHTML = `
      <div class="subject-top">
        <div>
          <div class="subject-name">${escapeHtml(s.name)}</div>
          <div class="subject-target" data-toggle-target="${s.id}">${ICONS.target}Target ${s.target}% — tap to change</div>
        </div>
        ${chipHtml(info)}
      </div>
      <div class="target-edit" id="target-edit-${s.id}" style="display:none;margin-top:8px;display:flex;gap:8px;align-items:center;">
        <input type="number" min="1" max="100" value="${s.target}" id="target-input-${s.id}" style="width:60px;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--ink);">
        <button data-save-target="${s.id}" style="padding:6px 12px;border-radius:6px;border:none;background:var(--gold);color:#1B1F26;font-weight:700;font-size:12px;">Save</button>
      </div>
      <div class="subject-stats">
        <div class="stat-box stat-attended"><span class="num">${agg.attended}</span><span class="lbl">Attended</span></div>
        <div class="stat-box stat-bunked"><span class="num">${agg.absent}</span><span class="lbl">Bunked</span></div>
        <div class="stat-box stat-remain"><span class="num">${agg.remaining}</span><span class="lbl">Remaining</span></div>
      </div>
      <div class="bunk-line">${info.status==='good'?ICONS.shield:ICONS.alert}${info.text}</div>
      ${partsHtml}
      <div class="add-part-form" id="add-part-${s.id}">
        <div class="row" style="display:flex;gap:8px;margin-bottom:8px;">
          <input type="text" id="np-name-${s.id}" placeholder="Part name" style="flex:1;padding:7px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--ink);">
          <input type="number" id="np-total-${s.id}" placeholder="Total" min="1" style="width:60px;padding:7px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--ink);">
          <input type="number" id="np-target-${s.id}" placeholder="Target%" min="1" max="100" value="${s.target}" style="width:65px;padding:7px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--ink);">
        </div>
        <button data-add-part="${s.id}">Add part</button>
      </div>
      <div class="link-row" style="margin-top:12px;">
        <button class="link-btn" data-toggle-addpart="${s.id}">${ICONS.plus}Add part</button>
        <button class="link-btn" data-del-subject="${s.id}" style="color:var(--bad);">${ICONS.trash}Delete subject</button>
      </div>
    `;
    list.appendChild(div);
  });

  const aggPctEl = document.getElementById('aggPct');
  const aggMetaEl = document.getElementById('aggMeta');
  if(grandHeld>0){
    const overallPct = Math.round((grandAttended/grandHeld)*100);
    aggPctEl.textContent = overallPct+'%';
    aggPctEl.style.color = overallPct>=75 ? 'var(--good)' : (overallPct>=65 ? 'var(--warn)' : 'var(--bad)');
    aggMetaEl.textContent = grandHeld+' classes recorded across '+data.subjects.length+' subject'+(data.subjects.length===1?'':'s');
  } else {
    aggPctEl.textContent='–'; aggPctEl.style.color='var(--ink)';
    aggMetaEl.textContent='no classes logged yet';
  }

  const streak = computeStreak();
  const streakRow = document.getElementById('streakRow');
  if(streak>0){
    streakRow.style.display='flex';
    document.getElementById('streakText').textContent = streak+' day streak';
  } else {
    streakRow.style.display='none';
  }

  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick = ()=> markPart(b.dataset.sid, b.dataset.pid, b.dataset.act==='present');
  });
  document.querySelectorAll('[data-toggle-edit]').forEach(b=>{
    b.onclick = ()=>{
      document.getElementById('edit-'+b.dataset.toggleEdit).classList.toggle('open');
    };
  });
  document.querySelectorAll('[data-save-part]').forEach(b=>{
    b.onclick = ()=>{
      const [sid,pid] = b.dataset.savePart.split('|');
      saveEditPart(sid,pid);
    };
  });
  document.querySelectorAll('[data-del-part]').forEach(b=>{
    b.onclick = ()=>{
      const [sid,pid] = b.dataset.delPart.split('|');
      if(confirm('Remove this part?')) deletePart(sid,pid);
    };
  });
  document.querySelectorAll('[data-toggle-target]').forEach(b=>{
    b.onclick = ()=>{
      const el = document.getElementById('target-edit-'+b.dataset.toggleTarget);
      el.style.display = el.style.display==='none' ? 'flex' : 'none';
    };
  });
  document.querySelectorAll('[data-save-target]').forEach(b=>{
    b.onclick = ()=>{
      const sid = b.dataset.saveTarget;
      const v = parseInt(document.getElementById('target-input-'+sid).value);
      if(v>0 && v<=100){
        const s = data.subjects.find(x=>x.id===sid);
        s.target = v; save(); render();
      }
    };
  });
  document.querySelectorAll('[data-toggle-addpart]').forEach(b=>{
    b.onclick = ()=>{
      document.getElementById('add-part-'+b.dataset.toggleAddpart).classList.toggle('open');
    };
  });
  document.querySelectorAll('[data-add-part]').forEach(b=>{
    b.onclick = ()=>{
      const sid = b.dataset.addPart;
      const s = data.subjects.find(x=>x.id===sid);
      const name = document.getElementById('np-name-'+sid).value.trim();
      const total = parseInt(document.getElementById('np-total-'+sid).value);
      const target = parseInt(document.getElementById('np-target-'+sid).value) || s.target;
      if(!name || !total || total<1) return;
      s.parts.push({id:'p_'+Date.now()+'_'+Math.floor(Math.random()*1000), name, total, target, attended:0, absent:0});
      save(); render();
    };
  });
  document.querySelectorAll('[data-del-subject]').forEach(b=>{
    b.onclick = ()=>{
      if(confirm('Delete this subject and all its data?')){
        data.subjects = data.subjects.filter(x=>x.id!==b.dataset.delSubject);
        save(); render();
      }
    };
  });
}

function markPart(sid, pid, present){
  const s = data.subjects.find(x=>x.id===sid);
  const p = s.parts.find(x=>x.id===pid);
  if(!p) return;
  if(present){ p.attended++; if(!data.presentDates.includes(todayStr())) data.presentDates.push(todayStr()); }
  else p.absent++;
  lastAction = {sid, pid, present};
  save(); render();
  showUndo(s.name+' — '+p.name+' marked '+(present?'present':'bunked'));
}

function showUndo(text){
  document.getElementById('undoText').textContent = text;
  document.getElementById('undoBar').classList.add('show');
  clearTimeout(window._undoTimer);
  window._undoTimer = setTimeout(()=>{ document.getElementById('undoBar').classList.remove('show'); lastAction=null; }, 6000);
}

document.getElementById('undoBtn').onclick = ()=>{
  if(!lastAction) return;
  const s = data.subjects.find(x=>x.id===lastAction.sid);
  const p = s && s.parts.find(x=>x.id===lastAction.pid);
  if(p){
    if(lastAction.present) p.attended = Math.max(0,p.attended-1);
    else p.absent = Math.max(0,p.absent-1);
  }
  save(); render();
  document.getElementById('undoBar').classList.remove('show');
  lastAction = null;
};

function saveEditPart(sid,pid){
  const s = data.subjects.find(x=>x.id===sid);
  const p = s.parts.find(x=>x.id===pid);
  p.attended = parseInt(document.getElementById('e-att-'+pid).value)||0;
  p.absent = parseInt(document.getElementById('e-abs-'+pid).value)||0;
  p.total = parseInt(document.getElementById('e-tot-'+pid).value)||1;
  p.target = parseInt(document.getElementById('e-tgt-'+pid).value)||75;
  save(); render();
}
function deletePart(sid,pid){
  const s = data.subjects.find(x=>x.id===sid);
  s.parts = s.parts.filter(x=>x.id!==pid);
  save(); render();
}

// Add subject form
let draftParts = [];
document.getElementById('addToggle').onclick = ()=>{
  document.getElementById('addForm').classList.toggle('open');
};
function renderDraftParts(){
  const el = document.getElementById('partsDraft');
  el.innerHTML = draftParts.map((p,i)=>`<div class="parts-draft-row"><span>${escapeHtml(p.name)} — ${p.total} classes · target ${p.target}%</span><button data-rm-draft="${i}">&times;</button></div>`).join('');
  el.querySelectorAll('[data-rm-draft]').forEach(b=>{
    b.onclick = ()=>{ draftParts.splice(parseInt(b.dataset.rmDraft),1); renderDraftParts(); };
  });
}
document.getElementById('draftPartAdd').onclick = ()=>{
  const name = document.getElementById('draftPartName').value.trim();
  const total = parseInt(document.getElementById('draftPartTotal').value);
  const overallTarget = parseInt(document.getElementById('newTarget').value) || 75;
  const target = parseInt(document.getElementById('draftPartTarget').value) || overallTarget;
  if(!name || !total || total<1) return;
  draftParts.push({name,total,target});
  document.getElementById('draftPartName').value='';
  document.getElementById('draftPartTotal').value='';
  document.getElementById('draftPartTarget').value='';
  renderDraftParts();
};
document.getElementById('newSave').onclick = ()=>{
  const name = document.getElementById('newName').value.trim();
  const target = parseInt(document.getElementById('newTarget').value) || 75;
  if(!name){ alert('Enter a subject name'); return; }
  if(draftParts.length===0){ alert('Add at least one part (e.g. Theory)'); return; }
  data.subjects.push({
    id:'sub_'+Date.now()+'_'+Math.floor(Math.random()*1000),
    name, target,
    parts: draftParts.map(p=>({id:'p_'+Date.now()+'_'+Math.floor(Math.random()*1000)+'_'+Math.random().toString(36).slice(2,6), name:p.name, total:p.total, target:p.target, attended:0, absent:0}))
  });
  draftParts = [];
  renderDraftParts();
  document.getElementById('newName').value='';
  document.getElementById('newTarget').value='75';
  document.getElementById('addForm').classList.remove('open');
  save(); render();
};

// Backup
document.getElementById('backupToggle').onclick = ()=>{
  const panel = document.getElementById('backupPanel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open')) document.getElementById('backupOut').value = JSON.stringify(data);
};
document.getElementById('backupRefresh').onclick = ()=>{
  document.getElementById('backupOut').value = JSON.stringify(data);
};
document.getElementById('backupCopy').onclick = ()=>{
  const ta = document.getElementById('backupOut');
  ta.select(); ta.setSelectionRange(0,999999);
  try{ document.execCommand('copy'); }catch(e){}
  try{ navigator.clipboard && navigator.clipboard.writeText(ta.value); }catch(e){}
  alert('Copied to clipboard');
};
document.getElementById('backupRestore').onclick = ()=>{
  restoreFromText(document.getElementById('backupIn').value.trim());
};

document.getElementById('backupDownload').onclick = ()=>{
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'attendance-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

document.getElementById('backupImportBtn').onclick = ()=>{
  document.getElementById('backupFileInput').click();
};
document.getElementById('backupFileInput').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=> restoreFromText(reader.result);
  reader.onerror = ()=> alert('Could not read that file');
  reader.readAsText(file);
  e.target.value = '';
};

function restoreFromText(raw){
  if(!raw) return;
  try{
    const parsed = JSON.parse(raw);
    if(!parsed.subjects) throw new Error('bad format');
    if(confirm('This will replace your current data. Continue?')){
      data = parsed;
      if(!data.presentDates) data.presentDates = [];
      save(); render();
      alert('Restored');
    }
  }catch(e){
    alert('That backup file looks invalid');
  }
}

load();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('SW failed', e));
  });
}
</script>
</body>
</html>
